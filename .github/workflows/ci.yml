name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:                       # cancela ejecuciones viejas de la misma rama
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read                   # mínimo privilegio

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]   # 3 jobs en paralelo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest              # exige cobertura >= 90 %
